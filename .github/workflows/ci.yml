name: CI

on:
  push:
  release:
    types: [published]

jobs:
  build:
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
        toit-version: [ v2.0.0-alpha.191, latest ]
        include:
          - toit-version: v2.0.0-alpha.191
            version-name: old
          - toit-version: latest
            version-name: new

    name: CI - ${{ matrix.os }} - ${{ matrix.version-name }}

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: toitlang/action-setup@v1
        with:
          toit-version: ${{ matrix.toit-version }}

      - name: Setup Multicast Route
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            sudo ip link set lo up
            sudo route add -net 224.0.0.0 netmask 240.0.0.0 dev lo
          elif [ "${{ runner.os }}" = "macOS" ]; then
            # Ensure loopback is up and supports multicast
            sudo ifconfig lo0 up
            # Add the general multicast route
            sudo route -n add -net 224.0.0.0/4 -interface lo0
            # Explicitly route the mDNS group to loopback
            sudo route -n add -host 224.0.0.251 -interface lo0
          fi

      - name: Test
        run: |
          make test
