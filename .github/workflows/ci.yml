name: CI

on:
  push:
  release:
    types: [published]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest ]

    name: CI - ${{ matrix.os }}

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: toitlang/action-setup@v1

      - name: Setup Multicast Route
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            sudo ip link set lo up
            sudo route add -net 224.0.0.0 netmask 240.0.0.0 dev lo || true
          elif [ "${{ runner.os }}" = "macOS" ]; then
            sudo ifconfig lo0 up
            # Newer macOS images ship a pre-existing 224.0.0.0/4 route, so
            # replace it (instead of adding) to send multicast via lo0.
            sudo route -n delete -net 224.0.0.0/4 || true
            sudo route -n add -net 224.0.0.0/4 -interface lo0
            netstat -rn -f inet | grep -E '^(224|Destination)' || true
          fi

      - name: Test
        run: make test
